<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Messenger</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <div id="sidebar">
            <div id="peers-container" class="sidebar-panel">
                <h2 id="online-header"><span class="online-indicator"></span>Connecting...</h2>
                <ul id="peers-list">
                </ul>
            </div>
            <div id="transmissions-container" class="sidebar-panel">
                <h2>Transmissions</h2>
                <div id="transmissions-list">
                    <p class="no-transmissions">No active transmissions.</p>
                </div>
            </div>
        </div>
        <div id="main-content">
            <div id="chat-container">
                <div id="chat-header">
                    <div>
                        <img src="icon.png" alt="Mars Icon" class="header-icon">
                        Mars Messenger
                    </div>
                    <button id="settings-button" title="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path fill-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.947 1.52l-.568 1.986c-.42.146-.82.33-1.2.558l-1.954-.488a1.875 1.875 0 00-2.115.334l-1.5 2.598a1.875 1.875 0 00.333 2.116l1.52 1.521c-.03.16-.053.323-.066.487l-1.986.568a1.875 1.875 0 00-1.52 1.947v1.875c0 .917.663 1.699 1.52 1.947l1.986.568c.146.42.33.82.558 1.2l-.488 1.954a1.875 1.875 0 00-.334 2.115l-2.598 1.5a1.875 1.875 0 00-2.116-.333l-1.521 1.52c.16.03.323.053.487.066l.568 1.986a1.875 1.875 0 001.947 1.52h1.875c.917 0 1.699-.663 1.947-1.52l.568-1.986c.42-.146.82-.33 1.2-.558l1.954.488a1.875 1.875 0 002.115-.334l1.5-2.598a1.875 1.875 0 00-.333-2.116l-1.52-1.521c.03-.16.053-.323.066-.487l1.986-.568a1.875 1.875 0 001.52-1.947v-1.875c0-.917-.663-1.699-1.52-1.947l-1.986-.568c-.146-.42-.33-.82-.558-1.2l.488-1.954a1.875 1.875 0 00-.334-2.115l-2.598-1.5a1.875 1.875 0 00-2.116.333l-1.521 1.52c-.16-.03-.323-.053-.487-.066l-.568-1.986A1.875 1.875 0 0012.922 2.25H11.08zM12 15.75a3.75 3.75 0 100-7.5 3.75 3.75 0 000 7.5z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                <div id="chat-messages">
                    <!-- Messages will be dynamically inserted here -->
                </div>
                 <div id="loading-indicator" class="hidden">
                    <span></span><span></span><span></span>
                </div>
                <div id="chat-input-container">
                    <button id="attach-button" title="Attach Image">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M10.5 3.75a2.25 2.25 0 00-3.182.002L2.27 8.79a2.25 2.25 0 000 3.182l3.182 3.182a2.25 2.25 0 003.182 0l4.5-4.5a.75.75 0 00-1.06-1.06l-4.5 4.5a.75.75 0 01-1.06 0L4.34 12.02a.75.75 0 010-1.06l5.04-5.04a.75.75 0 011.06 0l3.75 3.75a.75.75 0 01-1.06 1.06L9.47 7.15a.75.75 0 00-1.06 0L3.36 12.2a.75.75 0 000 1.06l6.36 6.36a.75.75 0 001.06 0l8.95-8.95a2.25 2.25 0 000-3.182L13.682 3.75a2.25 2.25 0 00-3.182 0z" clip-rule="evenodd" /></svg>
                    </button>
                    <button id="record-button" title="Record Voice Sample (5s max)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 1.75a4.25 4.25 0 00-4.25 4.25v6a4.25 4.25 0 008.5 0v-6A4.25 4.25 0 0012 1.75zM10.25 6a1.75 1.75 0 013.5 0v6a1.75 1.75 0 01-3.5 0v-6zM12 15.5a6.75 6.75 0 006.75-6.75h1.5a8.25 8.25 0 01-7.252 8.214l.252.786h3.25a.75.75 0 010 1.5h-8a.75.75 0 010-1.5h3.25l.252-.786A8.25 8.25 0 013.75 8.75h1.5A6.75 6.75 0 0012 15.5z"></path></svg>
                        <span id="record-timer"></span>
                    </button>
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                    <textarea id="chat-input" placeholder="Talk to Mission Control to compose your message..."></textarea>
                    <button id="send-button" title="Send message to AI assistant">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                    </button>
                </div>
                 <button id="finalize-button" class="hidden">Finalize &amp; Transmit to <span id="recipient-name"></span></button>
            </div>
        </div>
    </div>
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Advanced Settings</h2>
        <div class="setting-item">
          <label for="allow-voice-reuse-toggle" class="setting-label">Allow AI to use your voice sample for follow-up chat</label>
          <div class="toggle-switch">
            <input type="checkbox" id="allow-voice-reuse-toggle" class="toggle-input">
            <label for="allow-voice-reuse-toggle" class="toggle-slider"></label>
          </div>
        </div>
        <p class="setting-description">When enabled, the recipient's AI can use your voice sample to speak its responses during their entire conversation, not just for the initial message delivery.</p>
        <button id="close-settings-button" class="modal-close-button">Close</button>
      </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.module.mjs"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
